name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project parts
        id: detect
        run: |
          # React frontend once frontend/package.json exists, otherwise the static HTML in the repo root
          if [ -f frontend/package.json ]; then echo "frontend=true" >> "$GITHUB_OUTPUT"; else echo "frontend=false" >> "$GITHUB_OUTPUT"; fi
          # Laravel backend once backend/composer.json exists
          if [ -f backend/composer.json ]; then echo "backend=true" >> "$GITHUB_OUTPUT"; else echo "backend=false" >> "$GITHUB_OUTPUT"; fi

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          HOST: ${{ secrets.CPANEL_HOST }}
          PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # cPanel-generated keys carry a passphrase; strip it on the runner so ssh/rsync run non-interactively
          if [ -n "$SSH_PASSPHRASE" ]; then
            ssh-keygen -p -P "$SSH_PASSPHRASE" -N "" -f ~/.ssh/deploy_key > /dev/null
          fi
          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # ---------- Frontend (React + Vite, JSX) ----------

      - name: Setup Node
        if: steps.detect.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        if: steps.detect.outputs.frontend == 'true'
        working-directory: frontend
        env:
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          printf '%s\n' "$FRONTEND_ENV" > .env.production
          npm ci
          npm run build

      - name: Upload frontend
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          PORT: ${{ secrets.CPANEL_PORT }}
          CP_USER: ${{ secrets.CPANEL_USER }}
          TARGET: ${{ secrets.CPANEL_PATH }}
          IS_REACT: ${{ steps.detect.outputs.frontend }}
        run: |
          if [ "$IS_REACT" = "true" ]; then SRC=frontend/dist/; else SRC=./; fi
          # /backend/ is excluded so the Laravel entry point on the server is never deleted by --delete
          rsync -avz --delete \
            --exclude '/.git/' \
            --exclude '/.github/' \
            --exclude '/frontend/' \
            --exclude '/backend/' \
            --exclude '*.md' \
            --exclude '.nojekyll' \
            --exclude '.well-known/' \
            --exclude 'cgi-bin/' \
            --filter 'P .htaccess' \
            --filter 'P .user.ini' \
            -e "ssh -i ~/.ssh/deploy_key -p ${PORT:-22}" \
            "$SRC" "$CP_USER@$HOST:$TARGET/"

      # ---------- Backend (Laravel 10, PHP 8.1) ----------

      - name: Setup PHP 8.1
        if: steps.detect.outputs.backend == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          extensions: mbstring, pdo_mysql, bcmath, intl, zip

      - name: Install backend dependencies
        if: steps.detect.outputs.backend == 'true'
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Upload backend
        if: steps.detect.outputs.backend == 'true'
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          PORT: ${{ secrets.CPANEL_PORT }}
          CP_USER: ${{ secrets.CPANEL_USER }}
          WEB: ${{ secrets.CPANEL_PATH }}
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        run: |
          if [ -z "$BACKEND_ENV" ]; then
            echo "::error::BACKEND_ENV secret is required for the backend deploy"
            exit 1
          fi
          SSH="ssh -i $HOME/.ssh/deploy_key -p ${PORT:-22}"
          $SSH "$CP_USER@$HOST" "mkdir -p '$WEB/backend'"
          # Whole Laravel app goes to public_html/thetradersexpo.com/backend; the generated root index.php/.htaccess are kept
          rsync -az --delete \
            --exclude '/.env' \
            --exclude '/storage/' \
            --exclude '/node_modules/' \
            --exclude '/tests/' \
            --filter 'P /index.php' \
            --filter 'P /.htaccess' \
            --filter 'P /public/storage' \
            -e "$SSH" \
            backend/ "$CP_USER@$HOST:$WEB/backend/"
          printf '%s\n' "$BACKEND_ENV" | $SSH "$CP_USER@$HOST" "cat > '$WEB/backend/.env' && chmod 600 '$WEB/backend/.env'"

      - name: Run Laravel release tasks
        if: steps.detect.outputs.backend == 'true'
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          PORT: ${{ secrets.CPANEL_PORT }}
          CP_USER: ${{ secrets.CPANEL_USER }}
          WEB: ${{ secrets.CPANEL_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" "$CP_USER@$HOST" bash -s -- "$WEB/backend" <<'EOF'
          set -e
          APP="$1"
          PHP=/opt/cpanel/ea-php81/root/usr/bin/php
          cd "$APP"
          mkdir -p storage/app/public storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache

          # Front controller in the folder root so URLs are /backend/api/... (not /backend/public/api/...)
          sed "s#__DIR__.'/../#__DIR__.'/#g" public/index.php > index.php
          # Tell Laravel it lives at /backend; this server's PHP doesn't report the real script path after the rewrite,
          # so without this every route is seen as "backend/api/..." and returns 404.
          sed -i '1a $_SERVER["SCRIPT_NAME"] = $_SERVER["PHP_SELF"] = "/backend/index.php"; $_SERVER["SCRIPT_FILENAME"] = __FILE__;' index.php

          # The app sits inside the web root: block .env, source, vendor and storage; serve only public/ files and index.php
          cat > .htaccess <<'HT'
          Options -Indexes
          <FilesMatch "^\.">
              Require all denied
          </FilesMatch>
          <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteCond %{HTTP:Authorization} .
              RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
              RewriteRule ^(app|bootstrap|config|database|lang|resources|routes|storage|tests|vendor|node_modules)(/|$) - [F,L]
              RewriteRule ^(artisan|composer\.(json|lock)|package(-lock)?\.json|phpunit\.xml|vite\.config\.js)$ - [F,L]
              RewriteRule ^public/ - [L]
              RewriteCond __APP__/public/$1 -f
              RewriteRule ^(.*)$ public/$1 [L]
              RewriteRule ^ index.php [L]
          </IfModule>
          HT
          sed -i "s#__APP__#$APP#" .htaccess

          $PHP artisan storage:link || true
          $PHP artisan migrate --force
          $PHP artisan config:cache
          $PHP artisan route:cache
          $PHP artisan view:cache
          EOF

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
